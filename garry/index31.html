<html>
<head>
  <meta charset="UTF-8">
  <title>Click Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #count-display {
      font-size: 48px;
      font-weight: bold;
      margin: 20px 0;
    }
    button {
      font-size: 18px;
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 1. HTML Structure -->
  <h1>Endings Counter /24</h1>
  <div id="count-display">0</div>
  <button id="decrease-btn">Decrease</button>
  <button id="reset-btn">Reset</button>
  <button id="increase-btn">Increase</button>

  <!-- 2. JavaScript Logic -->
  <script>
    const display = document.getElementById('count-display');
    const increaseBtn = document.getElementById('increase-btn');
    const decreaseBtn = document.getElementById('decrease-btn');
    const resetBtn = document.getElementById('reset-btn');

    // Safely load saved count (prevents errors in restricted iframes/file previews)
    let count = 0;
    try {
      count = Number(localStorage.getItem('savedCount')) || 0;
    } catch (e) {
      console.warn('localStorage is not available in this environment.');
    }
    display.textContent = count;

    function updateCounter() {
      display.textContent = count;
      try {
        localStorage.setItem('savedCount', count);
      } catch (e) {
        // Ignore storage errors if blocked by browser security settings
      }
    }

    increaseBtn.addEventListener('click', () => {
      count++;
      updateCounter();
    });

    decreaseBtn.addEventListener('click', () => {
      count--;
      updateCounter();
    });

    resetBtn.addEventListener('click', () => {
      count = 0;
      updateCounter();
    });
  </script>

</body>
</html>
