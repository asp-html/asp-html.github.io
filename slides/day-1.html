<!DOCTYPE html>
<html lang="en"> 
<head> 
    <title>Handmade Websites Day 1</title> 
    <link rel="icon" type="image/webp" href="/favicon.webp"> 
    <link rel="stylesheet" type="text/css" href="code-sandbox.css">
    <link rel="stylesheet" type="text/css" href="slideshow.css">
    <script src="prism.js"></script>
    <style type="text/css"> 

        body {
            font-family: "Geist Pixel", monospace;
            background: lavenderblush;
            margin: 0;
            overflow: hidden;
        }

        h1, h2 {
            font-family: "Redaction 50", serif;
            text-align: center;
            font-size: 2.5rem;
            margin: 50px auto 4rem auto;
        }

        div.slideshow {
            display: flex;
            overflow-x: scroll;
            scrollbar-width: none;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            width: 100%;
        }

        div.slide {
            padding: 1rem 2rem;
            box-sizing: border-box;
            background: lavenderblush;
            scroll-snap-align: start;
            overflow-y: auto;
            flex: 0 0 100%;
            width: 100vw;
            scroll-snap-stop: always; 
            height: 100dvh;
        }

        div.content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 80%;
        }

        .cover * {
            color: sienna
        }

        .cover h1 {
            text-align: left;
            margin: 0 auto;
            color: sienna;
            text-shadow: 2px 2px yellow;
            font-family: "Geist Pixel", monospace;
        }

        .cover p {
            text-align: center;
            font-size: 2rem;
            color: sienna;
            margin-top: 4rem;
        }

        div.cover {
            color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: 0;
        }

        div.cover button {
            width: fit-content;
            margin: 8rem auto 0 auto;
            color: black;
            font-size: 2rem;
            font-family: "Geist Pixel", sans-serif;
            cursor: pointer;
        }

        iframe {
            height: 400px;
            width: 85%;
            max-width: 100%;
        }

        figure {
            max-width: 100vw;
        }

        figure.iframe {
            text-align: center;
        }

        figcaption {
            font-size: 1.3em;
        }

        #first-website {
            padding: 30px;
            margin: 0 auto;
            height: 400px;
            width: 85%;
            text-align: center;
        }

        .img-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .img-container figcaption {
            text-align: center;
            font-size: 1.2em;
        }

        .img-container figure img {
            width: 70%;
        }

    </style> 
</head>
<body>
    <div class="slideshow" id="slideshow">
        <div class="slide cover">
            <h1>&lt;h1>&ensp;Welcome to Handmade Website Building !&ensp;&lt;/h1></h1>
            <p><i>FSS MS ASP, Fall 2026</i></p>
            <marquee style="width: 200px; margin: 30px auto 0 auto; font-family: 'Redaction 50'; font-size: 2rem;" behavior="alternate">Day 1</marquee>
            <button onclick="openFullscreen();" id="fullBtn">present</button>
                        <p style="color: grey; font-size: 1.5em; position: relative; bottom: -60px; margin-right: 40px; text-align: right">arrow or scroll ⇢</p>
        </div>

        <div class="slide">
            <h2>WHAT IS... A WEBSITE?</h2>
            <div class="content">
                <figure>
                    <code-sandbox console hidden>
                        <div for="intro"></div>
                        <textarea for="html">&lt;h2>A website is:&lt;/h2>
&lt;ul>
    &lt;li>a house?&lt;/li>
    &lt;li>a shelf?&lt;/li>
    &lt;li>&lt;i>add more here...&lt;/i>&lt;/li>
&lt;/ul></textarea>
                        <textarea for="css">body { 
    font-size: 1.5em; 
}</textarea>
                    </code0-sandbox>
                </figure>
            </div>
        </div>

        <div class="slide">
            <h2>THE FIRST INTERNET</h2>
            <div class="content">
                <div class="img-container">
                    <figure>
                    <img src="images/arpanet-1969.png">
                    <figcaption>ARPANET 1969</figcaption>
                    </figure>
                    <figure>
                    <img src="images/arpanet-1970.png">
                    <figcaption>ARPANET 1970</figcaption>
                    </figure>
                </div>
            </div>
        </div>

        <div class="slide">
            <h2>THE FIRST WEBSITE</h2>
            <div class="content">
                <figure class="iframe">
                <iframe src="https://info.cern.ch/hypertext/WWW/TheProject.html"  id="first-website" title="first-website"></iframe>
                <figcaption style="text-align: center"><a href="https://info.cern.ch/hypertext/WWW/TheProject.html">https://info.cern.ch/hypertext/WWW/TheProject.html</a></figcaption>
                </figure>
            </div>
        </div>

        <div class="slide">
            <h2>HTML TAGS</h2>
            <div class="content">
                <figure class="iframe">
                <iframe src="https://info.cern.ch/hypertext/WWW/MarkUp/Tags.html"  id="first-website" title="first-website"></iframe>
                <figcaption style="text-align: center"><a href="https://info.cern.ch/hypertext/WWW/MarkUp/Tags.html">https://info.cern.ch/hypertext/WWW/MarkUp/Tags.html</a></figcaption>
                </figure>
            </div>
        </div>

        <div class="slide">
            <h2>HTML IS A SANDWICH</h2>
            <div class="content">
                <p style="font-size: 2rem; text-align: center;">&lt;bun>   ....content....   &lt;/bun></p>
            </div>
        </div>

    </div>
    <script type="module" src="code-sandbox.js"></script>
    <script>
        document.getElementById('first-website').contentWindow.document.body.innerHTML

        const btn = document.getElementById("fullBtn");
        const container = document.getElementById('slideshowContainer');

        window.addEventListener('keydown', (event) => {

            if (event.key === 'ArrowRight') {
                container.scrollBy({ left: window.innerWidth, behavior: 'smooth' });
            }

            if (event.key === 'ArrowLeft') {
                container.scrollBy({ left: -window.innerWidth, behavior: 'smooth' });
            }
        });

        var elem = document.getElementById("slideshow");

        /* Function to open fullscreen mode */
        function openFullscreen() {
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }

            btn.style.display = "none";
        }
    </script>
</body>
</html>
