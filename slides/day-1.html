<!DOCTYPE html>
<html lang="en"> 
<head> 
    <title>Handmade Websites Day 1</title> 
    <link rel="icon" type="image/webp" href="/favicon.webp"> 
    <link rel="stylesheet" type="text/css" href="code-sandbox.css">
    <link rel="stylesheet" type="text/css" href="slideshow.css">
    <script src="prism.js"></script>
    <style type="text/css"> 

        body {
            font-family: "Geist Pixel", monospace;
            background: lavenderblush;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            font-family: "Redaction 50", serif;
            text-align: center;
            font-size: 2.5rem;
            margin: 0 auto 4rem auto;
            position: relative;
            top: 30px;
        }

        h2 {
            font-family: "Geist Pixel", monospace;
        }

        div.slideshow {
            display: flex;
            overflow-x: scroll;
            scrollbar-width: none;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            width: 100%;
        }

        div.slide {
            padding: 1rem 2rem;
            box-sizing: border-box;
            background: lavenderblush;
            scroll-snap-align: start;
            overflow-y: auto;
            flex: 0 0 100%;
            width: 100vw;
            scroll-snap-stop: always; 
            height: 100dvh;
        }

        div.content {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .cover h1 {
            text-align: left;
            margin: 0 auto;
            text-shadow: 3px 3px magenta;
            color: black;
        }

        .cover p {
            text-align: center;
            font-size: 2rem;
        }

        div.cover {
            color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: 0;
        }

        iframe {
            height: 400px;
            width: 85%;
            max-width: 100%;
        }

        figure {
            max-width: 100vw;
        }

        #first-website {
            padding: 30px;
            margin: 0 auto;
            height: 400px;
            width: 85%;
            text-align: center;
        }

        .img-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .img-container figcaption {
            text-align: center;
            font-size: 1.2em;
        }

        .img-container figure img {
            width: 100%;
        }

    </style> 
</head>
<body>
    <div class="slideshow">
        <div class="slide cover">
            <h1>&lt;h1><br>&emsp;Welcome to Handmade Website Building !<br>&lt;/h1></h1>
            <p><i>FSS MS ASP, Fall 2026</i></p>
            <marquee style="width: 200px; margin: 30px auto 0 auto; font-family: 'Redaction 50'; font-size: 2rem;" behavior="alternate">Day 1</marquee>
            <p style="color: grey; font-size: 1.3em; margin-top: 12%; margin-right: 40px; text-align: right">scroll right --></p>
        </div>

        <div class="slide">
            <h1>What is... a website?</h1>
            <div class="content">
                <figure>
                    <code-sandbox console hidden>
                        <div for="intro"></div>
                        <textarea for="html">&lt;h2>Some ideas:&lt;/h2>
&lt;ul>
    &lt;li>a house?&lt;/li>
    &lt;li>a shelf?&lt;/li>
    &lt;li>write in more here...&lt;/li>
&lt;/ul></textarea>
                        <textarea for="css">body { 
    font-size: 1.5em; 
}</textarea>
                    </code-sandbox>
                </figure>
            </div>
        </div>

        <div class="slide">
            <h1>THE FIRST INTERNET</h1>
            <div class="content">
                <div class="img-container">
                    <figure>
                    <img src="arpanet-1969.png">
                    <figcaption>ARPANET 1969</figcaption>
                    </figure>
                    <figure>
                    <img src="arpanet-1970.png">
                    <figcaption>ARPANET 1970</figcaption>
                    </figure>
                </div>
            </div>
        </div>

        <div class="slide">
            <h1>THE FIRST WEBSITE</h1>
            <div class="content">
                <figure>
                <iframe src="https://info.cern.ch/hypertext/WWW/TheProject.html"  id="first-website" title="first-website"></iframe>
                <figcaption style="text-align: center"><a href="https://info.cern.ch/hypertext/WWW/TheProject.html">https://info.cern.ch/hypertext/WWW/TheProject.html</a></figcaption>
                </figure>
            </div>
        </div>

        <div class="slide">
            <h1>HTML IS A SANDWICH</h1>
            <p style="font-size: 2rem; text-align: center;">&lt;bun>   ....content....   &lt;/bun></p>
        </div>

    </div>
    <script type="module" src="code-sandbox.js"></script>
    <script>
        document.getElementById('first-website').contentWindow.document.body.innerHTML
    </script>
</body>
</html>
