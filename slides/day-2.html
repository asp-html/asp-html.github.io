<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handmade Websites Day 2</title>
    <link rel="icon" type="image/webp" href="/favicon.webp"> 
    <link rel="stylesheet" type="text/css" href="code-sandbox.css">
    <link rel="stylesheet" type="text/css" href="slideshow.css">
    <script src="prism.js"></script>
    <style type="text/css"> 

        body {
            font-family: "Geist Pixel", monospace;
            background: lavenderblush;
            margin: 0;
            overflow: hidden;
        }

        h1, h2 {
            font-family: "Redaction 50", serif;
            text-align: center;
            font-size: 2.5rem;
            margin: 50px auto 2rem auto;
        }

        h3 {
            font-size: 2rem;
        }

        p, ol, ul, summary {
            font-size: 2em;
        }

        li {
            margin: 1em 0;
        }

        div.slideshow {
            display: flex;
            overflow-x: scroll;
            scrollbar-width: none;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            width: 100%;
        }

        section.slide {
            padding: 1rem 6rem;
            box-sizing: border-box;
            background: lavenderblush;
            scroll-snap-align: start;
            overflow-y: auto;
            flex: 0 0 100%;
            width: 100vw;
            scroll-snap-stop: always; 
            height: 100dvh;
        }

        div.content {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        div.list {
            align-items: center;
            padding: 0 4rem;
        }

        .cover * {
            color: sienna
        }

        .cover h1 {
            text-align: left;
            margin: 0 auto;
            color: sienna;
            text-shadow: 2px 2px yellow;
            font-family: "Geist Pixel", monospace;
        }

        .cover p {
            text-align: center;
            font-size: 2rem;
            color: sienna;
            margin-top: 4rem;
        }

        section.cover {
            color: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: 0;
        }

        section.cover button {
            width: fit-content;
            height: fit-content;
            margin: 0;
            color: black;
            padding: 5px;
            font-size: 2rem;
            font-family: "Geist Pixel", sans-serif;
            cursor: pointer;
        }

        iframe {
            height: 400px;
            width: 85%;
            max-width: 100%;
            background-color: white;
        }

        figure {
            max-width: 100vw;
        }

        figure.iframe {
            text-align: center;
        }

        iframe {
            width: 100%;
            height: 450px;
        }

        figcaption {
            font-size: 1.3em;
            text-align: center;
        }

        .row-container {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
        }

        .row-container figure {
            text-align: center;
            width: 50%;
        }

        .row-container figcaption {
            text-align: center;
            font-size: 1.2em;
        }

        .row-container img {
            width: 70%;
        }

        code-sandbox {
            margin: 4rem auto;
        }
        
        #fullscreen {
            position: relative;
            bottom: 10px; 
            left: -80px;
            width: 30px;
            filter: opacity(0.5);
            background: none;
            border: none;
        }

        .house { 
            background: aliceblue; 
            display: inline-block;
            height: fit-content;
            margin-left: 20px;
            margin-top: 55px; 
            position: relative; 
            width: 300px;
            min-width: 300px;
            max-width: 300px; 
            padding: 15px;
        } 

        .house:before {
            border-bottom: 50px solid aliceblue;
            border-left: 165px solid transparent;
            border-right: 165px solid transparent;
            content: "";
            height: 0;
            left: 0;
            position: absolute;
            top: -50px;
            width: 0;
        }

    </style> 
</head>
<body>
    <div class="slideshow" id="slideshow">
        <section class="slide cover" aria-labelledby="cover-header">
            <h1 id="cover-header">&lt;h1>&ensp;Handmade Website Building: Day 2!&ensp;&lt;/h1></h1>
            <p><i>FSS MS ASP, Fall 2026</i></p>
            <marquee style="width: 400px; margin: 30px auto 0 auto; font-family: 'Redaction 50'; font-size: 2rem;" direction="right" behavior="alternate"><i>Coming soon...</i></marquee>
            <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; margin: 0; position: relative; bottom: -25%;">
                <button onclick="openFullscreen();" id="fullBtn">presentation mode</button>
                <p style="color: grey; font-size: 2em; margin: 0">arrow or scroll ⇢</p>
            </div>
        </section>
    </div>
</body>
</html>
